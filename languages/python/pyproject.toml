[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "longfellow-vectors"
version = "0.0.1.dev0"
description = "Test vectors for Longfellow zero-knowledge proof implementations: keys, credentials, presentations, circuits, certificates, and proofs with citable provenance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Schepers", email = "nathan.schepers@protonmail.com" }]
dependencies = [
    "cbor2>=6.1.4",
    "jsonschema[format]>=4.26.0",
    "referencing>=0.31",
]

[project.urls]
Homepage = "https://github.com/pipe23-org/longfellow-vectors"
Documentation = "https://longfellow-vectors.readthedocs.io/"
Repository = "https://github.com/pipe23-org/longfellow-vectors"
Issues = "https://github.com/pipe23-org/longfellow-vectors/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/longfellow_vectors"]



[dependency-groups]
test = ["pytest>=8", "pytest-cov"]
docs = ["mkdocs-material", "mkdocstrings[python]", "interrogate"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ruff",
    "mypy",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]


# Closed list via `select`, never `extend-select`: a ruff upgrade must not change
# which rules run. Widen the list deliberately, per project.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.interrogate]
fail-under = 100
ignore-init-module = false

[tool.coverage.run]
branch = true
source = ["longfellow_vectors"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']
