name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv build
        working-directory: languages/python
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: languages/python/dist/*

  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c "import tomllib; print(tomllib.load(open('languages/python/pyproject.toml','rb'))['project']['version'])")"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match pyproject version $ver"; exit 1; }

  publish:
    needs: [ build, check-version ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          n=0
          until pip install --no-cache-dir longfellow-vectors; do
            n=$((n + 1))
            [ "$n" -ge 5 ] && exit 1
            sleep 20
          done
      - run: python -c "import longfellow_vectors; print(getattr(longfellow_vectors, '__version__', 'ok'))"

  release:
    needs: [ build, check-version, publish, smoke ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release from CHANGELOG
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          notes="$(mktemp)"
          awk -v want="$version" '
            /^## / {
              if (found) { exit }
              if ($2 == want) { found = 1; next }
            }
            found { print }
            END { if (!found) { exit 1 } }
          ' CHANGELOG.md > "$notes" || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
