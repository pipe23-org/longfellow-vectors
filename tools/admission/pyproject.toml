[project]
name = "longfellow-vectors-admission"
version = "0.0.0"
description = "Admission tooling for the longfellow-vectors collection."
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5",
    "cryptography>=42",
    "jsonschema[format]>=4",
    "referencing>=0.31",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
